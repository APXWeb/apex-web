phrases.forEach(p=>{const ws=p.text.replace(/\.\.\./g,'…').split(/\s+/).filter(Boolean);
  const wt=ws.map(w=>w.replace(/[^\wÀ-ú]/g,'').length+1.6);const tot=wt.reduce((a,b)=>a+b,0);let acc=0;
  p.words=ws.map((w,i)=>{const st=p.start+acc/tot*p.dur*0.96;acc+=wt[i];return {w,st};});
  p.chunks=[];let cur=[];for(const w of p.words){cur.push(w);if(cur.length>=3||/[.,?!:…]$/.test(w.w)){p.chunks.push(cur);cur=[];}}if(cur.length)p.chunks.push(cur);});
function captions(t){let p=null;for(const q of phrases)if(t>=q.start-0.05&&t<q.start+q.dur+0.25)p=q;
  if(!p){capEl.innerHTML='';return;}
  let ci=0;p.chunks.forEach((c,i)=>{if(t>=c[0].st-0.02)ci=i;});const ch=p.chunks[ci];const nOn=ch.filter(x=>t>=x.st).length;
  capEl.innerHTML=ch.map((w,i)=>{const on=t>=w.st;const sc=on?1+0.18*Math.max(0,1-(t-w.st)/0.12):1;return `<span class="${on&&i===nOn-1?'on':''}" style="transform:scale(${sc.toFixed(3)})">${w.w}</span>`;}).join(' ');
  const age=t-ch[0].st;capEl.style.transform=`scale(${(age<0.12?0.85+age/0.12*0.15:1).toFixed(3)})`;}
