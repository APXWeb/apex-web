   if(t<pop){const k0=ease((t-P0.start+0.4)/(pop-P0.start+0.4));cp=lerpV(V(-0.9,0.8,4.2),V(-0.6,0.9,3.0),k0);cl=V(1.0,5.5,-20);}
   else if(t<P2.start){cp=V(-0.6,0.9,3.0);cl=V(1.0,5.5,-20);shake=0.05*Math.max(0,1-k*2);}
   else if(t<P3.start){const k2=ease((t-P2.start)/0.5);cp=lerpV(V(0.9,1.5,3.6),V(0.5,1.65,2.6),k2);cl=V(0,1.45,0);}
   else {const k3=eOut((t-P3.start)/0.3);cp=lerpV(V(0.5,1.65,2.6),V(0.12,1.78,1.3),k3);cl=V(0,1.76,0);shake=0.012;}
   camAt(cp,cl,shake,t);},
 noite(t,S){const P0=ph('noite',0),P1=ph('noite',1),P2=ph('noite',2);

   S.hemi.intensity=lerp(0.12,1.0,moonlit);S.dl.intensity=lerp(0,1.4,moonlit);S.moonG.visible=moonlit>0.05;S.moon.material.opacity=moonlit;S.mglow.material.opacity=0.8*moonlit;
   S.lamps.forEach((l,i)=>l.intensity=(t>P2.start&&i>0)?0:6*(i==0||moonlit>0?1:0));

     S.spot.position.copy(hp);S.spot.target.position.copy(hp.clone().add(V(3,-1.6,0)));}

 praia(t,S){const P0=ph('praia',0),P1=ph('praia',1),P2=ph('praia',2);
   scene.background=S.bg;scene.fog=fogN;fogN.color.set(0xffb38a);fogN.near=30;fogN.far=90;
   const lt=t-P0.start;const amp=lerp(1.1,0.35,ease((lt-0.6)/1.8));

   let cp,cl;

   else {const k=eOut((t-P2.start)/0.3);cp=lerpV(V(-1.0,1.9,-11.2),V(-0.4,1.85,-10.0),k);cl=V(0,1.75,-8.4);}

 calendario(t,S){const P0=ph('calendario',0),P1=ph('calendario',1),P2=ph('calendario',2);
   scene.background=S.bg;scene.fog=null;
   let ex='normal',pose={aRx:-1.4,aRz:0.5,hy:0.6,hx:0};

   let cp,cl;const lt=t-P0.start;
   if(t<P1.start){const k=ease(lt/2.8);cp=lerpV(V(0.5,2.6,5.5),V(0.0,2.6,4.2),k);cl=V(-0.4,2.6,-3);}

   else {const k=eOut((t-P2.start)/0.3);cp=lerpV(V(0.8,2.4,5.0),V(0.6,2.4,4.4),k);cl=V(0,2.2,-2);}

 lobisomem(t,S){const P0=ph('lobisomem',0),P1=ph('lobisomem',1);
   scene.background=S.bg;scene.fog=fogN;fogN.color.set(0x070a18);fogN.near=10;fogN.far=40;

   showSt('s_desemp',t,P1.start+0.15,SC.lobisomem.end,-5);
   let cp,cl;if(!sad){const k=ease((t-P0.start)/1.2);cp=lerpV(V(3,3,7),V(1.2,1.6,3.4),k);cl=V(0,1.2,0);}
   else{const k=eOut((t-P1.start)/0.25);cp=lerpV(V(1.2,1.6,3.4),V(0.3,1.45,1.9),k);cl=V(0,1.35,0);}

 clima(t,S){const P0=ph('clima',0),P1=ph('clima',1),P2=ph('clima',2),P3=ph('clima',3);
   const inSpace=t<P2.start;S.space.visible=inSpace;S.land.visible=!inSpace;
   if(inSpace){scene.background=new THREE.Color(0x02030a);scene.fog=null;
     const lt=t-P0.start;S.earth.rotation.y=lt*0.8;
     const wob=ease((t-P1.start-1.5)/2.5);const ang=23.4+wob*(Math.sin((t-P1.start)*2.4)*25+Math.sin((t-P1.start)*1.1)*12);
     S.tilt.rotation.z=THREE.MathUtils.degToRad(ang);S.tilt.rotation.x=wob*Math.sin((t-P1.start)*1.7)*0.25;
     stk.s_ang.textContent=Math.round(Math.abs(ang))+'°';showSt('s_ang',t,P1.start+1.0,P2.start,-3);
     const k=ease(lt/2);camAt(lerpV(V(0,1,13),V(0,0.5,9.5),k),V(0,0,0),0,t);
     showSt('s_hot',t,-1,-1);showSt('s_cold',t,-1,-1);}
   else{const cold=t>P3.start;showSt('s_ang',t,-1,-1);
     S.sandG.visible=S.cacti.visible=!cold;S.snowG.visible=S.pines.visible=S.snow.visible=cold;S.ch.root.visible=!cold;S.chCold.root.visible=cold;
     scene.background=new THREE.Color(cold?0xb8c8dc:0xffb060);scene.fog=fogN;fogN.color.copy(scene.background);fogN.near=12;fogN.far=50;
     S.sunG.visible=!cold;S.hemi.color.set(cold?0xdde8ff:0xffd080);S.hemi.intensity=cold?1.1:1.3;S.dl.color.set(cold?0xdde6ff:0xfff0b0);
     const ch=cold?S.chCold:S.ch;const lt=t-(cold?P3.start:P2.start);
     if(!cold){ch.face('hot');ch.pose({aRx:-2.4,aRz:0.2+Math.sin(lt*14)*0.25,hx:-0.15,tz:Math.sin(lt*3)*0.04});
       const hp=V(0,1.95,0.0);S.drops.forEach(([d,a,b],i)=>{const k=((lt*1.2+a)%1);d.visible=true;d.position.set((a-.5)*0.5,1.95-k*1.2,0.22+(b-.5)*0.2);});

       const a=S.snow.geometry.attributes.position.array;S.snowSeed.forEach(([x,y,z,r],i)=>{a[i*3]=x+Math.sin(lt*2+r*9)*0.3;a[i*3+1]=((y-lt*(1.5+r))%10+10)%10;a[i*3+2]=z;});S.snow.geometry.attributes.position.needsUpdate=true;
       showSt('s_cold',t,P3.start+0.1,SC.clima.end,4);showSt('s_hot',t,-1,-1);}
     const k=eOut(lt/0.4);camAt(lerpV(V(0.8,1.8,4.4),V(0.5,1.6,3.0),k),V(0,1.4,0),cold?0.006:0,t);}
   },
 final(t,S){const P0=ph('final',0),P1=ph('final',1);

};

window.renderAt=function(t){
  const s=sceneAt(t);activate(s.id);U[s.id](t,sets[s.id]);
  for(const id in stk){const keep=['hook','noite','praia','calendario','lobisomem','clima','final'];}
  // hide stickers of other scenes
  const own={noite:['s_antes','s_depois'],praia:['s_3x','s_q'],calendario:['s_pas','s_ram','s_ano'],lobisomem:['s_desemp'],clima:['s_ang','s_hot','s_cold'],final:['s_cm','s_unha','s_com']};
  for(const k in own)if(k!==s.id)own[k].forEach(id=>stk[id].style.opacity=0);
  // scene-cut flash
  if(s.id!=='hook'){const k=t-s.start;flash.style.opacity=k<0.12?0.35*(1-k/0.12):0;}
  captions(t);
  renderer.render(scene,camera);
};
window.TOTAL=TL.total;window.ready=true;window.renderAt(0.5);
